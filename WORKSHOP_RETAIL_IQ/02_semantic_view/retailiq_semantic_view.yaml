name: RETAILIQ_SV
description: "Semantic View for RetailIQ retail analytics — covers sales performance, customer behavior, product analytics, and store operations across Italian regions."

tables:
  # ═══════════════════════════════════════════════════════════════════════════════
  # ORDERS — Fact table for all transactional data
  # ═══════════════════════════════════════════════════════════════════════════════
  - name: orders
    description: "Transactional order records including channel, pricing, quantity, discount, shipping, and return details."
    base_table:
      database: RETAILIQ_DB
      schema: ANALYTICS
      table: ORDERS
    primary_key:
      columns: [order_id]

    dimensions:
      - name: order_channel
        synonyms: ["channel", "sales channel", "purchase channel", "how purchased", "canale"]
        description: "Sales channel through which the order was placed: In-Store, Online, or Mobile App."
        expr: channel
        data_type: VARCHAR
        is_enum: true
        sample_values: ["In-Store", "Online", "Mobile App"]

      - name: order_status
        synonyms: ["status", "order state", "stato ordine"]
        description: "Current status of the order: Completed, Returned, Pending, or Cancelled."
        expr: status
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Completed", "Returned", "Cancelled", "Pending"]

      - name: is_return
        synonyms: ["return", "returned", "reso", "has return"]
        description: "Indicates whether the order was flagged as a return."
        expr: return_flag
        data_type: BOOLEAN

    time_dimensions:
      - name: order_date
        synonyms: ["date", "when", "order day", "purchase date", "data ordine"]
        description: "Date on which the order was placed."
        expr: order_date
        data_type: DATE

      - name: order_month
        synonyms: ["month", "monthly", "mese"]
        description: "Calendar month in which the order was placed, truncated to the first day of the month."
        expr: DATE_TRUNC('month', order_date)
        data_type: DATE

      - name: order_quarter
        synonyms: ["quarter", "quarterly", "trimestre"]
        description: "Calendar quarter in which the order was placed, truncated to the first day of the quarter."
        expr: DATE_TRUNC('quarter', order_date)
        data_type: DATE

      - name: order_year
        synonyms: ["year", "annual", "anno"]
        description: "Calendar year in which the order was placed."
        expr: YEAR(order_date)
        data_type: NUMBER

    facts:
      - name: order_total_amount
        synonyms: ["total amount", "order value", "order total"]
        description: "Total monetary value of the order after discounts."
        expr: total_amount
        data_type: NUMBER

      - name: order_quantity
        synonyms: ["quantity", "units", "items"]
        description: "Number of units purchased in this order."
        expr: quantity
        data_type: NUMBER

      - name: order_unit_price
        description: "Unit price at which the product was sold in this order."
        expr: unit_price
        data_type: NUMBER

      - name: order_discount_pct
        synonyms: ["discount", "sconto"]
        description: "Discount percentage applied to this order (0 if none)."
        expr: discount_pct
        data_type: NUMBER

      - name: order_shipping_days
        synonyms: ["shipping days", "delivery days", "delivery time"]
        description: "Number of days between order placement and delivery (0 for In-Store)."
        expr: shipping_days
        data_type: NUMBER

    metrics:
      - name: total_revenue
        synonyms: ["revenue", "sales", "fatturato", "total sales", "gross revenue", "ricavi"]
        description: "Total revenue from completed orders."
        expr: SUM(CASE WHEN status = 'Completed' THEN total_amount ELSE 0 END)

      - name: order_count
        synonyms: ["number of orders", "orders", "# orders", "ordini"]
        description: "Total number of completed or returned orders."
        expr: COUNT(DISTINCT CASE WHEN status IN ('Completed', 'Returned') THEN order_id END)

      - name: completed_order_count
        synonyms: ["completed orders", "successful orders"]
        description: "Number of orders with status Completed."
        expr: COUNT(DISTINCT CASE WHEN status = 'Completed' THEN order_id END)

      - name: average_order_value
        synonyms: ["AOV", "average basket", "scontrino medio", "average ticket"]
        description: "Average revenue per completed order."
        expr: SUM(CASE WHEN status = 'Completed' THEN total_amount ELSE 0 END) / NULLIF(COUNT(DISTINCT CASE WHEN status = 'Completed' THEN order_id END), 0)

      - name: return_rate
        synonyms: ["return ratio", "% returns", "tasso resi"]
        description: "Percentage of orders that were returned."
        expr: COUNT(DISTINCT CASE WHEN return_flag = TRUE THEN order_id END) * 100.0 / NULLIF(COUNT(DISTINCT order_id), 0)

      - name: total_units_sold
        synonyms: ["units", "items sold", "pezzi venduti"]
        description: "Total number of units sold in completed orders."
        expr: SUM(CASE WHEN status = 'Completed' THEN quantity ELSE 0 END)

      - name: customer_count
        synonyms: ["customers", "unique customers", "clienti"]
        description: "Number of distinct customers who placed orders."
        expr: COUNT(DISTINCT customer_id)

      - name: average_discount
        synonyms: ["discount", "sconto medio"]
        description: "Average discount percentage applied to discounted orders."
        expr: AVG(CASE WHEN discount_pct > 0 THEN discount_pct END)

      - name: avg_shipping_days
        synonyms: ["delivery time", "shipping speed", "tempo consegna"]
        description: "Average number of shipping days for non-store orders."
        expr: AVG(CASE WHEN channel != 'In-Store' THEN shipping_days END)

  # ═══════════════════════════════════════════════════════════════════════════════
  # PRODUCTS — Product catalog dimension table
  # ═══════════════════════════════════════════════════════════════════════════════
  - name: products
    description: "Product catalog with category hierarchy, brand, cost, list price, and premium flag."
    base_table:
      database: RETAILIQ_DB
      schema: ANALYTICS
      table: PRODUCTS
    primary_key:
      columns: [product_id]

    dimensions:
      - name: product_name
        synonyms: ["product", "item", "article", "prodotto"]
        description: "Commercial name of the product."
        expr: product_name
        data_type: VARCHAR

      - name: product_category
        synonyms: ["category", "product type", "department", "categoria"]
        description: "Top-level product category."
        expr: category
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Electronics", "Clothing & Apparel", "Food & Beverage", "Home & Garden", "Sports & Outdoors"]

      - name: product_subcategory
        synonyms: ["subcategory", "sub-category", "sottocategoria"]
        description: "Second-level product category within the main category."
        expr: subcategory
        data_type: VARCHAR

      - name: brand
        synonyms: ["brand name", "marca"]
        description: "Brand or manufacturer of the product."
        expr: brand
        data_type: VARCHAR

      - name: is_premium_product
        synonyms: ["premium", "luxury", "high-end"]
        description: "Indicates whether the product is classified as premium."
        expr: is_premium
        data_type: BOOLEAN

    facts:
      - name: product_unit_cost
        description: "Unit cost paid by RetailIQ for this product."
        expr: unit_cost
        data_type: NUMBER

      - name: product_list_price
        description: "Standard list price of the product before discounts."
        expr: list_price
        data_type: NUMBER

  # ═══════════════════════════════════════════════════════════════════════════════
  # CUSTOMERS — Customer dimension table
  # ═══════════════════════════════════════════════════════════════════════════════
  - name: customers
    description: "Customer master data including location (city/region), loyalty tier, age group, and signup date."
    base_table:
      database: RETAILIQ_DB
      schema: ANALYTICS
      table: CUSTOMERS
    primary_key:
      columns: [customer_id]

    dimensions:
      - name: customer_region
        synonyms: ["region", "area", "geographic area", "zona", "regione"]
        description: "Italian region where the customer is located (e.g. Lombardia, Lazio, Sicilia)."
        expr: region
        data_type: VARCHAR

      - name: customer_city
        synonyms: ["city", "città"]
        description: "City where the customer is located."
        expr: city
        data_type: VARCHAR

      - name: loyalty_tier
        synonyms: ["loyalty", "tier", "membership level", "card type", "livello fedeltà"]
        description: "Customer loyalty program tier."
        expr: loyalty_tier
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Bronze", "Silver", "Gold", "Platinum"]

      - name: customer_age_group
        synonyms: ["age", "demographic", "fascia d'età", "age group"]
        description: "Age group bucket of the customer."
        expr: age_group
        data_type: VARCHAR
        is_enum: true
        sample_values: ["18-25", "26-35", "36-50", "50+"]

    time_dimensions:
      - name: customer_signup_date
        synonyms: ["signup date", "registration date", "data iscrizione"]
        description: "Date when the customer signed up."
        expr: signup_date
        data_type: DATE

  # ═══════════════════════════════════════════════════════════════════════════════
  # STORES — Store dimension table
  # ═══════════════════════════════════════════════════════════════════════════════
  - name: stores
    description: "Physical and digital store locations with type, region, opening year, and employee headcount."
    base_table:
      database: RETAILIQ_DB
      schema: ANALYTICS
      table: STORES
    primary_key:
      columns: [store_id]

    dimensions:
      - name: store_name
        synonyms: ["store", "location", "negozio"]
        description: "Name of the store."
        expr: store_name
        data_type: VARCHAR

      - name: store_region
        synonyms: ["store area", "store region", "regione negozio"]
        description: "Italian region where the store is located."
        expr: region
        data_type: VARCHAR

      - name: store_type
        synonyms: ["store format", "tipo negozio"]
        description: "Format/type of the store."
        expr: store_type
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Flagship", "Standard", "Express", "Pop-Up"]

    facts:
      - name: store_employee_count
        synonyms: ["employees", "headcount", "dipendenti"]
        description: "Number of employees working at the store."
        expr: employee_count
        data_type: NUMBER

# ═══════════════════════════════════════════════════════════════════════════════
# RELATIONSHIPS
# ═══════════════════════════════════════════════════════════════════════════════
relationships:
  - name: orders_to_products
    left_table: orders
    right_table: products
    relationship_columns:
      - left_column: product_id
        right_column: product_id

  - name: orders_to_customers
    left_table: orders
    right_table: customers
    relationship_columns:
      - left_column: customer_id
        right_column: customer_id

  - name: orders_to_stores
    left_table: orders
    right_table: stores
    relationship_columns:
      - left_column: store_id
        right_column: store_id

# ═══════════════════════════════════════════════════════════════════════════════
# DERIVED METRICS (cross-table, combining table-level metrics)
# ═══════════════════════════════════════════════════════════════════════════════
metrics:
  - name: revenue_per_customer
    synonyms: ["ARPU", "average revenue per customer", "ricavo per cliente"]
    description: "Average revenue per distinct customer."
    expr: orders.total_revenue / NULLIF(orders.customer_count, 0)

# ═══════════════════════════════════════════════════════════════════════════════
# CUSTOM INSTRUCTIONS
# ═══════════════════════════════════════════════════════════════════════════════
module_custom_instructions:
  sql_generation: |
    When computing revenue, always filter for status = 'Completed' unless explicitly asked about all orders.
    Format currency values in EUR. Round percentages to 2 decimal places.
    When grouping by time, default to monthly granularity unless the user specifies otherwise.
    The term "region" refers to customer_region (from customers table) unless the user explicitly says "store region".
  question_categorization: |
    If the user asks about "customer satisfaction", "reviews", "feedback", or "complaints",
    classify the question as OUT_OF_SCOPE and suggest using the Cortex Search service instead,
    as this semantic view only covers structured transactional data.

# ═══════════════════════════════════════════════════════════════════════════════
# VERIFIED QUERIES
# ═══════════════════════════════════════════════════════════════════════════════
verified_queries:
  - name: top_5_categories_by_revenue
    question: "What are the top 5 product categories by revenue in the last 3 months?"
    use_as_onboarding_question: true
    sql: |
      SELECT p.category,
             SUM(o.total_amount) AS revenue
      FROM RETAILIQ_DB.ANALYTICS.ORDERS o
      JOIN RETAILIQ_DB.ANALYTICS.PRODUCTS p ON o.product_id = p.product_id
      WHERE o.status = 'Completed'
        AND o.order_date >= DATEADD('month', -3, CURRENT_DATE())
      GROUP BY 1
      ORDER BY 2 DESC
      LIMIT 5

  - name: revenue_by_region_ytd
    question: "What is the total revenue by customer region year-to-date?"
    use_as_onboarding_question: true
    sql: |
      SELECT c.region AS customer_region,
             SUM(o.total_amount) AS revenue
      FROM RETAILIQ_DB.ANALYTICS.ORDERS o
      JOIN RETAILIQ_DB.ANALYTICS.CUSTOMERS c ON o.customer_id = c.customer_id
      WHERE o.status = 'Completed'
        AND YEAR(o.order_date) = YEAR(CURRENT_DATE())
      GROUP BY 1
      ORDER BY 2 DESC

  - name: monthly_revenue_trend_last_12m
    question: "Show me the monthly revenue trend for the last 12 months"
    use_as_onboarding_question: true
    sql: |
      SELECT DATE_TRUNC('month', o.order_date) AS month,
             SUM(o.total_amount) AS revenue
      FROM RETAILIQ_DB.ANALYTICS.ORDERS o
      WHERE o.status = 'Completed'
        AND o.order_date >= DATEADD('month', -12, CURRENT_DATE())
      GROUP BY 1
      ORDER BY 1

  - name: top_10_products_by_units
    question: "Which are the top 10 best-selling products by units sold this year?"
    sql: |
      SELECT p.product_name,
             p.category,
             SUM(o.quantity) AS units_sold
      FROM RETAILIQ_DB.ANALYTICS.ORDERS o
      JOIN RETAILIQ_DB.ANALYTICS.PRODUCTS p ON o.product_id = p.product_id
      WHERE o.status = 'Completed'
        AND YEAR(o.order_date) = YEAR(CURRENT_DATE())
      GROUP BY 1, 2
      ORDER BY 3 DESC
      LIMIT 10

  - name: return_rate_by_category
    question: "What is the return rate by product category?"
    sql: |
      SELECT p.category,
             ROUND(100.0 * COUNT(DISTINCT CASE WHEN o.return_flag = TRUE THEN o.order_id END)
                         / NULLIF(COUNT(DISTINCT o.order_id), 0), 2) AS return_rate_pct
      FROM RETAILIQ_DB.ANALYTICS.ORDERS o
      JOIN RETAILIQ_DB.ANALYTICS.PRODUCTS p ON o.product_id = p.product_id
      GROUP BY 1
      ORDER BY 2 DESC

  - name: revenue_by_channel_and_loyalty
    question: "How does revenue break down by sales channel and customer loyalty tier?"
    sql: |
      SELECT o.channel,
             c.loyalty_tier,
             SUM(o.total_amount) AS revenue
      FROM RETAILIQ_DB.ANALYTICS.ORDERS o
      JOIN RETAILIQ_DB.ANALYTICS.CUSTOMERS c ON o.customer_id = c.customer_id
      WHERE o.status = 'Completed'
      GROUP BY 1, 2
      ORDER BY 1, 3 DESC

  - name: avg_order_value_by_store_type
    question: "What is the average order value by store type?"
    sql: |
      SELECT s.store_type,
             ROUND(AVG(o.total_amount), 2) AS avg_order_value
      FROM RETAILIQ_DB.ANALYTICS.ORDERS o
      JOIN RETAILIQ_DB.ANALYTICS.STORES s ON o.store_id = s.store_id
      WHERE o.status = 'Completed'
      GROUP BY 1
      ORDER BY 2 DESC

  - name: premium_vs_standard_product_margin
    question: "What is the gross margin for premium vs standard products?"
    sql: |
      SELECT CASE WHEN p.is_premium = TRUE THEN 'Premium' ELSE 'Standard' END AS product_tier,
             SUM(o.total_amount) AS revenue,
             SUM(o.total_amount - o.quantity * p.unit_cost) AS gross_margin,
             ROUND(100.0 * SUM(o.total_amount - o.quantity * p.unit_cost)
                         / NULLIF(SUM(o.total_amount), 0), 2) AS margin_pct
      FROM RETAILIQ_DB.ANALYTICS.ORDERS o
      JOIN RETAILIQ_DB.ANALYTICS.PRODUCTS p ON o.product_id = p.product_id
      WHERE o.status = 'Completed'
      GROUP BY 1

  - name: top_stores_by_revenue
    question: "What are the top 10 stores by revenue this year?"
    sql: |
      SELECT s.store_name,
             s.region AS store_region,
             s.store_type,
             SUM(o.total_amount) AS revenue
      FROM RETAILIQ_DB.ANALYTICS.ORDERS o
      JOIN RETAILIQ_DB.ANALYTICS.STORES s ON o.store_id = s.store_id
      WHERE o.status = 'Completed'
        AND YEAR(o.order_date) = YEAR(CURRENT_DATE())
      GROUP BY 1, 2, 3
      ORDER BY 4 DESC
      LIMIT 10

  - name: revenue_by_channel_ytd
    question: "What is the total revenue by channel year to date?"
    use_as_onboarding_question: true
    sql: |
      SELECT o.channel,
             SUM(o.total_amount) AS revenue,
             COUNT(DISTINCT o.order_id) AS order_count
      FROM RETAILIQ_DB.ANALYTICS.ORDERS o
      WHERE o.status = 'Completed'
        AND YEAR(o.order_date) = YEAR(CURRENT_DATE())
      GROUP BY 1
      ORDER BY 2 DESC
