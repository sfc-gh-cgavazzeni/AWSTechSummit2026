AWSTemplateFormatVersion: "2010-09-09"
Description: >
  RetailIQ Workshop - AWS Bedrock AgentCore Environment.
  Self-contained stack: creates a VPC, public subnet, Internet Gateway, and an
  EC2 instance pre-configured with Strands SDK, connected via SSM Session Manager.
  Snowflake MCP credentials are stored in AWS Secrets Manager.

# ============================================================
# PARAMETERS
# ============================================================
Parameters:
  SnowflakeMCPEndpoint:
    Type: String
    Description: >
      Snowflake MCP Server endpoint URL.
      Format: https://<account_url>/api/v2/databases/RETAILIQ_DB/schemas/ANALYTICS/mcp-servers/RETAILIQ_MCP_SERVER_AGENT
    AllowedPattern: "^https://.*snowflakecomputing\\.com/.*$"
    ConstraintDescription: "Must be a valid Snowflake MCP endpoint URL"

  SnowflakePATToken:
    Type: String
    Description: >
      Snowflake Programmatic Access Token (PAT).
      Generate via: ALTER USER retailiq_user ADD PROGRAMMATIC ACCESS TOKEN ...
    NoEcho: true
    MinLength: 10

  SnowflakeAccountLocator:
    Type: String
    Description: >
      Snowflake account locator (e.g. SFSEEUROPE-DEMO_CGAVAZZENI).
      Find in Snowsight: bottom-left circle → Account → Account details.
    AllowedPattern: "^[A-Za-z0-9._-]+$"

  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 AMI (leave default)

# ============================================================
# RESOURCES
# ============================================================
Resources:

  # ----------------------------------------------------------
  # VPC + NETWORKING (fully self-contained)
  # ----------------------------------------------------------
  WorkshopVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "RetailIQ-Workshop-VPC-${AWS::StackName}"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "RetailIQ-Workshop-IGW-${AWS::StackName}"

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref WorkshopVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WorkshopVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "RetailIQ-Workshop-PublicSubnet-${AWS::StackName}"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref WorkshopVPC
      Tags:
        - Key: Name
          Value: !Sub "RetailIQ-Workshop-RT-${AWS::StackName}"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ----------------------------------------------------------
  # SECURITY GROUP (outbound only — no inbound SSH needed)
  # ----------------------------------------------------------
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RetailIQ Workshop - outbound HTTPS only (SSM + Snowflake)
      VpcId: !Ref WorkshopVPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS outbound (AWS APIs, Snowflake MCP, SSM)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP outbound (package repos)
      Tags:
        - Key: Name
          Value: !Sub "RetailIQ-Workshop-SG-${AWS::StackName}"

  # ----------------------------------------------------------
  # SECRETS MANAGER
  # ----------------------------------------------------------
  SnowflakeCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: retailiq-workshop-credentials
      Description: Snowflake MCP credentials for RetailIQ workshop
      SecretString: !Sub |
        {
          "snowflake_mcp_endpoint": "${SnowflakeMCPEndpoint}",
          "snowflake_pat_token": "${SnowflakePATToken}",
          "snowflake_account": "${SnowflakeAccountLocator}"
        }

  # ----------------------------------------------------------
  # IAM ROLE
  # ----------------------------------------------------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "RetailIQ-EC2-Role-${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
      Policies:
        - PolicyName: SecretsAndLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Ref SnowflakeCredentialsSecret
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/retailiq/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # ----------------------------------------------------------
  # EC2 INSTANCE
  # ----------------------------------------------------------
  WorkshopInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M
    Properties:
      InstanceType: t3.small
      ImageId: !Ref AmiId
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: !Ref PublicSubnet
          AssociatePublicIpAddress: true
          GroupSet:
            - !Ref InstanceSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub "RetailIQ-Workshop-${AWS::StackName}"
        - Key: Workshop
          Value: RetailIQ-AgentCore
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > /var/log/retailiq-setup.log 2>&1

          signal_cfn() {
            /opt/aws/bin/cfn-signal --exit-code $1 \
              --stack "${AWS::StackName}" \
              --resource WorkshopInstance \
              --region "${AWS::Region}"
          }
          trap 'signal_cfn $?' EXIT

          # ── System update ──
          dnf update -y
          dnf install -y python3.11 python3.11-pip python3.11-devel git

          # Make python3.11 the default python3
          alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          alternatives --set python3 /usr/bin/python3.11

          # ── Python packages ──
          python3.11 -m pip install --upgrade pip
          python3.11 -m pip install strands-agents strands-agents-tools
          python3.11 -m pip install boto3 httpx requests rich

          # ── Workspace ──
          mkdir -p /opt/retailiq/logs
          chmod 777 /opt/retailiq /opt/retailiq/logs

          # ── Download agent script from GitHub ──
          curl -fsSL -o /opt/retailiq/retailiq_agent.py \
            "https://raw.githubusercontent.com/sfc-gh-cgavazzeni/AWSTechSummit2026/main/WORKSHOP_RETAIL_IQ/03_aws_setup/retailiq_agent.py"

          # ── Config loader ──
          cat > /opt/retailiq/config.py << 'PYEOF'
          import boto3, json, os

          SECRET_NAME = os.environ.get("RETAILIQ_SECRET", "retailiq-workshop-credentials")
          REGION = os.environ.get("AWS_DEFAULT_REGION", "${AWS::Region}")

          def load_credentials():
              client = boto3.client("secretsmanager", region_name=REGION)
              secret = json.loads(client.get_secret_value(SecretId=SECRET_NAME)["SecretString"])
              return secret

          def get_mcp_endpoint():
              return load_credentials()["snowflake_mcp_endpoint"]

          def get_pat_token():
              return load_credentials()["snowflake_pat_token"]

          def get_account_locator():
              return load_credentials()["snowflake_account"]
          PYEOF

          # ── Bash shortcuts ──
          cat >> /home/ec2-user/.bashrc << 'BASHEOF'
          export RETAILIQ_HOME=/opt/retailiq
          export AWS_DEFAULT_REGION=${AWS::Region}
          alias retailiq='cd /opt/retailiq && python3.11 retailiq_agent.py'
          echo "  RetailIQ Workshop Ready — run: retailiq"
          BASHEOF

          # Also for ssm-user (SSM Session Manager default user)
          cat >> /home/ssm-user/.bashrc << 'BASHEOF' 2>/dev/null || true
          export RETAILIQ_HOME=/opt/retailiq
          export AWS_DEFAULT_REGION=${AWS::Region}
          alias retailiq='cd /opt/retailiq && python3.11 retailiq_agent.py'
          echo "  RetailIQ Workshop Ready — run: retailiq"
          BASHEOF
          mkdir -p /home/ssm-user && cp /home/ec2-user/.bashrc /home/ssm-user/.bashrc 2>/dev/null || true

          chown -R ec2-user:ec2-user /opt/retailiq
          echo "==> Setup complete."

# ============================================================
# OUTPUTS
# ============================================================
Outputs:
  InstanceId:
    Description: EC2 Instance ID — use for SSM Session Manager connection
    Value: !Ref WorkshopInstance

  SSMConnectURL:
    Description: Direct link to connect via SSM Session Manager
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${WorkshopInstance}?region=${AWS::Region}"

  SecretArn:
    Description: Secrets Manager ARN with Snowflake credentials
    Value: !Ref SnowflakeCredentialsSecret

  NextSteps:
    Description: Quick-start instructions
    Value: !Sub |
      1. Connect: AWS Console → EC2 → ${WorkshopInstance} → Connect → Session Manager
      2. Run: cd /opt/retailiq && python3.11 retailiq_agent.py
      3. Credentials auto-loaded from Secrets Manager
